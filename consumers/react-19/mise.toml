[tasks.dev]
description = "Start the development server"
run = "pnpm exec vite"
depends = ["//definitions/svelte-vite:build"]

[tasks.build]
description = "Build the app"
run = "pnpm exec vite build"
depends = ["//definitions/svelte-vite:build"]
sources = ["index.html", "src/**/*", "tsconfig.app.json", "vite.config.ts"]
outputs = ["dist/**/*"]

[tasks.check]
description = "Run all checks"
run = [{ task = "check:app" }, { task = "check:node" }]

[tasks."check:app"]
description = "Type-check the app"
run = "pnpm exec tsc -p tsconfig.app.json"
depends = ["//definitions/svelte-vite:build:cem"]
hide = true

[tasks."check:node"]
description = "Type-check configuration files"
run = "pnpm exec tsc -p tsconfig.node.json"
hide = true

[tasks.test]
description = "Run all checks"
run = [{ task = "check" }]
